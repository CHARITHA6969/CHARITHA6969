name: Edge AI case study tests

on:
  push:
    paths:
      - "projects/**"
      - ".github/workflows/project-tests.yml"
  pull_request:
    paths:
      - "projects/**"
      - ".github/workflows/project-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic event-correlation tests
        run: python -m unittest discover -s projects/tests -v
