<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Charitha Pittala — AI Engineering, ML Systems, Edge AI</title>
  <desc id="desc">A dark technical banner with connected nodes and data pathways representing AI engineering, machine learning systems, and edge intelligence.</desc>
  <defs>
